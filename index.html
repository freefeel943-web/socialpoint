<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialPoint</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #6b7280;
    }

    .tabs button.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    .main-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #userPanel {
      display: none;
      text-align: center;
    }

    #userEmail {
      margin: 15px 0;
      color: #374151;
      word-break: break-word;
    }

    .logout-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #16a34a;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="authPanel">

    <h1>SocialPoint</h1>
    <p class="subtitle">Create your account or login</p>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <div id="loginForm" class="form active">

      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder
