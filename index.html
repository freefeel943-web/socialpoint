<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialPoint</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}
header{
  background:#2563eb;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  max-width:600px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 3px 12px #0002;
}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
.logout{
  background:#dc2626;
}
.hidden{
  display:none;
}
.link{
  background:#f8fafc;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}
.link a{
  word-break:break-all;
}
#message{
  text-align:center;
  font-weight:bold;
  margin:10px;
}
.points{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  color:#2563eb;
}
</style>
</head>

<body>

<header>
<h1>SocialPoint</h1>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p style="text-align:center">
Don't have an account?
<a href="#" onclick="showRegister()">Register</a>
</p>
</div>

<!-- REGISTER -->
<div id="registerBox" class="card hidden">
<h2>Create Account</h2>

<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<input id="regConfirm" type="password" placeholder="Confirm Password">

<button onclick="register()">Create Account</button>

<p style="text-align:center">
Already have an account?
<a href="#" onclick="showLogin()">Login</a>
</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">
<h2>Welcome! 🎉</h2>
<p id="userEmail"></p>

<div class="points">
⭐ <span id="points">0</span> Points
</div>
</div>

<!-- ADD LINK -->
<div class="card">
<h2>➕ Add Social Link</h2>

<select id="platform">
<option value="YouTube">YouTube</option>
<option value="Facebook">Facebook</option>
<option value="Instagram">Instagram</option>
<option value="TikTok">TikTok</option>
</select>

<input id="socialUrl"
type="url"
placeholder="Paste your social media link">

<input id="pointsCost"
type="number"
value="10"
min="1"
placeholder="Points cost">

<button onclick="addLink()">Add Link</button>
</div>

<!-- MY LINKS -->
<div class="card">
<h2>🔗 My Links</h2>
<div id="myLinks">
<p>No links yet.</p>
</div>
</div>

<div class="card">
<button class="logout" onclick="logout()">Logout</button>
</div>

</div>

<div id="message"></div>

</div>

<script>

const SUPABASE_URL =
"https://ryogzmvgklqnlzvcwmxb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m8Q46q_qqRbWr-ZSeFDwFg_i0L4T8oo";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;


/* SHOW REGISTER */

function showRegister(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.remove("hidden");

}


/* SHOW LOGIN */

function showLogin(){

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("loginBox")
.classList.remove("hidden");

}


/* REGISTER */

async function register(){

const email =
document.getElementById("regEmail").value.trim();

const password =
document.getElementById("regPassword").value;

const confirm =
document.getElementById("regConfirm").value;

if(!email || !password || !confirm){

showMessage("Please fill all fields.");
return;

}

if(password !== confirm){

showMessage("Passwords do not match.");
return;

}

if(password.length < 6){

showMessage("Password must be at least 6 characters.");
return;

}

showMessage("Creating account...");

const {data,error} =
await supabaseClient.auth.signUp({

email:email,
password:password

});

if(error){

showMessage(error.message);
return;

}

showMessage(
"Account created! Check your Gmail."
);

}


/* LOGIN */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

showMessage("Logging in...");

const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});

if(error){

showMessage(error.message);
return;

}

currentUser = data.user;

await createProfile();

showDashboard();

}


/* CREATE PROFILE */

async function createProfile(){

const {data,error} =
await supabaseClient
.from("profiles")
.select("id")
.eq("id",currentUser.id)
.maybeSingle();

if(data) return;

await supabaseClient
.from("profiles")
.insert({

id:currentUser.id,
email:currentUser.email,
points:100

});

}


/* DASHBOARD */

async function showDashboard(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("userEmail").innerText =
"Logged in as: " + currentUser.email;

await loadPoints();
await loadLinks();

showMessage("");

}


/* LOAD POINTS */

async function loadPoints(){

const {data,error} =
await supabaseClient
.from("profiles")
.select("points")
.eq("id",currentUser.id)
.single();

if(data){

document.getElementById("points")
.innerText = data.points ?? 0;

}

}


/* ADD LINK */

async function addLink(){

const platform =
document.getElementById("platform").value;

const url =
document.getElementById("socialUrl").value.trim();

const cost =
parseInt(
document.getElementById("pointsCost").value
);

if(!url){

showMessage("Please enter your social link.");
return;

}

if(!url.startsWith("http://") &&
!url.startsWith("https://")){

showMessage("Please enter a valid link.");
return;

}

if(!cost || cost < 1){

showMessage("Enter valid points.");
return;

}

showMessage("Adding link...");

const {error} =
await supabaseClient
.from("links")
.insert({

user_id:currentUser.id,
platform:platform,
url:url,
points_cost:cost

});

if(error){

showMessage(error.message);
return;

}

document.getElementById("socialUrl").value="";

showMessage("Link added successfully! ✅");

await loadLinks();

}


/* LOAD MY LINKS */

async function loadLinks(){

const {data,error} =
await supabaseClient
.from("links")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false});

const box =
document.getElementById("myLinks");

if(error){

box.innerHTML =
"<p>Could not load links.</p>";

return;

}

if(!data || data.length === 0){

box.innerHTML =
"<p>No links yet.</p>";

return;

}

box.innerHTML="";

data.forEach(link=>{

const div =
document.createElement("div");

div.className="link";

div.innerHTML =

"<b>"+link.platform+"</b><br>" +

"<a href='"+link.url+"' target='_blank'>"+
link.url+
"</a><br>" +

"⭐ Cost: "+
link.points_cost+
" Points";

box.appendChild(div);

});

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;

document.getElementById("dashboard")
.classList.add("hidden");

document.getElementById("loginBox")
.classList.remove("hidden");

}


/* MESSAGE */

function showMessage(text){

document.getElementById("message")
.innerText=text;

}


/* CHECK LOGIN */

async function checkUser(){

const {data} =
await supabaseClient.auth.getUser();

if(data.user){

currentUser=data.user;

await createProfile();
await showDashboard();

}

}

checkUser();

</script>

</body>
</html>
