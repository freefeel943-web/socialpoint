<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialPoint</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}
header{
  background:#2563eb;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  max-width:600px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 3px 12px #0002;
}
input,textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
.logout{
  background:#dc2626;
}
.hidden{
  display:none;
}
#message{
  text-align:center;
  font-weight:bold;
  margin:10px;
}
</style>
</head>

<body>

<header>
<h1>SocialPoint</h1>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p style="text-align:center">
Don't have an account?
<a href="#" onclick="showRegister()">Register</a>
</p>
</div>

<!-- REGISTER -->
<div id="registerBox" class="card hidden">
<h2>Create Account</h2>

<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<input id="regConfirm" type="password" placeholder="Confirm Password">

<button onclick="register()">Create Account</button>

<p style="text-align:center">
Already have an account?
<a href="#" onclick="showLogin()">Login</a>
</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">
<h2>Welcome! 🎉</h2>
<p id="userEmail"></p>
</div>

<div class="card">
<h2>Create Post 📝</h2>

<textarea id="postText" rows="4"
placeholder="What's on your mind?"></textarea>

<button onclick="createPost()">Post</button>
</div>

<div id="posts"></div>

<div class="card">
<button class="logout" onclick="logout()">Logout</button>
</div>

</div>

<div id="message"></div>

</div>

<script>

const SUPABASE_URL =
"https://ryogzmvgklqnlzvcwmxb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m8Q46q_qqRbWr-ZSeFDwFg_i0L4T8oo";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function showRegister(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.remove("hidden");

}


function showLogin(){

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("loginBox")
.classList.remove("hidden");

}


async function register(){

const email =
document.getElementById("regEmail").value.trim();

const password =
document.getElementById("regPassword").value;

const confirm =
document.getElementById("regConfirm").value;


if(!email || !password || !confirm){

document.getElementById("message").innerText =
"Please fill all fields.";

return;
}


if(password !== confirm){

document.getElementById("message").innerText =
"Passwords do not match.";

return;
}


if(password.length < 6){

document.getElementById("message").innerText =
"Password must be at least 6 characters.";

return;
}


document.getElementById("message").innerText =
"Creating account...";


const {error} =
await supabaseClient.auth.signUp({

email:email,
password:password

});


if(error){

document.getElementById("message").innerText =
error.message;

return;
}


document.getElementById("message").innerText =
"Account created! Check your Gmail.";

}


async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


document.getElementById("message").innerText =
"Logging in...";


const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});


if(error){

document.getElementById("message").innerText =
error.message;

return;
}


showDashboard(data.user);

}


function showDashboard(user){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("userEmail").innerText =
"Logged in as: " + user.email;

document.getElementById("message").innerText = "";

}


async function logout(){

await supabaseClient.auth.signOut();

document.getElementById("dashboard")
.classList.add("hidden");

document.getElementById("loginBox")
.classList.remove("hidden");

}


function createPost(){

const text =
document.getElementById("postText").value.trim();

if(!text){

alert("Please write something!");

return;
}


const post =
document.createElement("div");

post.className="card";

post.innerHTML =
"<h3>👤 You</h3>" +
"<p>"+text+"</p>" +
"<button onclick='likePost(this)'>❤️ Like</button>";

document.getElementById("posts")
.prepend(post);

document.getElementById("postText").value="";

}


function likePost(button){

button.innerText="❤️ Liked";

}

</script>

</body>
</html>
