<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialPoint</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}
header{
  background:#2563eb;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  max-width:650px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 3px 12px #0002;
}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
.logout{
  background:#dc2626;
}
.hidden{
  display:none;
}
.points{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  color:#2563eb;
}
.link{
  background:#f8fafc;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}
.link a{
  word-break:break-all;
}
.campaign{
  background:#f8fafc;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
}
#message{
  text-align:center;
  font-weight:bold;
  margin:10px;
}
</style>
</head>

<body>

<header>
<h1>SocialPoint</h1>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p style="text-align:center">
Don't have an account?
<a href="#" onclick="showRegister()">Register</a>
</p>
</div>


<!-- REGISTER -->
<div id="registerBox" class="card hidden">
<h2>Create Account</h2>

<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<input id="regConfirm" type="password" placeholder="Confirm Password">

<button onclick="register()">Create Account</button>

<p style="text-align:center">
Already have an account?
<a href="#" onclick="showLogin()">Login</a>
</p>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<!-- PROFILE -->
<div class="card">
<h2>Welcome! 🎉</h2>
<p id="userEmail"></p>

<div class="points">
⭐ <span id="points">0</span> Points
</div>
</div>


<!-- ADD LINK -->
<div class="card">
<h2>➕ Add Social Link</h2>

<select id="platform">
<option value="YouTube">YouTube</option>
<option value="Facebook">Facebook</option>
<option value="Instagram">Instagram</option>
<option value="TikTok">TikTok</option>
</select>

<input
id="socialUrl"
type="url"
placeholder="Paste your social media link">

<input
id="pointsCost"
type="number"
value="10"
min="1"
placeholder="Points cost">

<button onclick="addLink()">Add Link</button>
</div>


<!-- MY LINKS -->
<div class="card">
<h2>🔗 My Links</h2>
<div id="myLinks">
<p>No links yet.</p>
</div>
</div>


<!-- CREATE CAMPAIGN -->
<div class="card">
<h2>📢 Create Campaign</h2>

<select id="campaignLink">
<option value="">Select your link</option>
</select>

<select id="action">
<option value="Visit">Visit Link</option>
<option value="Like">Like</option>
<option value="Follow">Follow</option>
<option value="Subscribe">Subscribe</option>
</select>

<input
id="reward"
type="number"
value="10"
min="1"
placeholder="Reward Points">

<input
id="budget"
type="number"
value="100"
min="1"
placeholder="Campaign Budget">

<button onclick="createCampaign()">
Create Campaign
</button>

</div>


<!-- MY CAMPAIGNS -->
<div class="card">
<h2>📋 My Campaigns</h2>

<div id="myCampaigns">
<p>No campaigns yet.</p>
</div>

</div>


<!-- LOGOUT -->
<div class="card">
<button class="logout" onclick="logout()">
Logout
</button>
</div>

</div>

<div id="message"></div>

</div>


<script>

const SUPABASE_URL =
"https://ryogzmvgklqnlzvcwmxb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m8Q46q_qqRbWr-ZSeFDwFg_i0L4T8oo";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;


/* REGISTER */

function showRegister(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.remove("hidden");

}


function showLogin(){

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("loginBox")
.classList.remove("hidden");

}


async function register(){

const email =
document.getElementById("regEmail")
.value.trim();

const password =
document.getElementById("regPassword")
.value;

const confirm =
document.getElementById("regConfirm")
.value;

if(!email || !password || !confirm){

showMessage("Please fill all fields.");
return;

}

if(password !== confirm){

showMessage("Passwords do not match.");
return;

}

if(password.length < 6){

showMessage("Password must be at least 6 characters.");
return;

}

showMessage("Creating account...");

const {error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){

showMessage(error.message);
return;

}

showMessage(
"Account created! Check your Gmail."
);

}


/* LOGIN */

async function login(){

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

showMessage("Logging in...");

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

showMessage(error.message);
return;

}

currentUser = data.user;

await loadProfile();

await showDashboard();

}


/* LOAD PROFILE */

async function loadProfile(){

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("auth_id",currentUser.id)
.maybeSingle();

if(data){

currentProfile = data;
return;

}

const username =
currentUser.email.split("@")[0];

const {data:newProfile,error:createError} =
await supabaseClient
.from("profiles")
.insert({
username:username,
points:100,
auth_id:currentUser.id
})
.select()
.single();

if(createError){

showMessage(createError.message);
return;

}

currentProfile = newProfile;

}


/* DASHBOARD */

async function showDashboard(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("userEmail").innerText =
"Logged in as: " + currentUser.email;

await loadPoints();
await loadLinks();
await loadCampaigns();

showMessage("");

}


/* LOAD POINTS */

async function loadPoints(){

if(!currentProfile) return;

const {data,error} =
await supabaseClient
.from("profiles")
.select("points")
.eq("id",currentProfile.id)
.single();

if(data){

document.getElementById("points")
.innerText = data.points ?? 0;

}

}


/* ADD LINK */

async function addLink(){

const platform =
document.getElementById("platform").value;

const url =
document.getElementById("socialUrl")
.value.trim();

const cost =
parseInt(
document.getElementById("pointsCost").value
);

if(!url){

showMessage("Please enter your social link.");
return;

}

if(!url.startsWith("http://") &&
!url.startsWith("https://")){

showMessage("Please enter a valid link.");
return;

}

if(!cost || cost < 1){

showMessage("Enter valid points.");
return;

}

showMessage("Adding link...");

const {error} =
await supabaseClient
.from("links")
.insert({

user_id:currentProfile.id,
platform:platform,
url:url,
points_cost:cost

});

if(error){

showMessage(error.message);
return;

}

document.getElementById("socialUrl")
.value="";

showMessage("Link added successfully! ✅");

await loadLinks();

}


/* LOAD LINKS */

async function loadLinks(){

const {data,error} =
await supabaseClient
.from("links")
.select("*")
.eq("user_id",currentProfile.id)
.order("created_at",{ascending:false});

const box =
document.getElementById("myLinks");

const select =
document.getElementById("campaignLink");

select.innerHTML =
'<option value="">Select your link</option>';

if(error){

box.innerHTML =
"<p>Could not load links.</p>";

return;

}

if(!data || data.length===0){

box.innerHTML =
"<p>No links yet.</p>";

return;

}

box.innerHTML="";

data.forEach(link=>{

const div =
document.createElement("div");

div.className="link";

div.innerHTML =
"<b>"+link.platform+"</b><br>" +
"<a href='"+link.url+"' target='_blank'>"+
link.url+
"</a><br>" +
"⭐ Cost: "+
link.points_cost+
" Points";

box.appendChild(div);


const option =
document.createElement("option");

option.value=link.id;

option.textContent =
link.platform+" - "+link.url;

select.appendChild(option);

});

}


/* CREATE CAMPAIGN */

async function createCampaign(){

const linkId =
document.getElementById("campaignLink").value;

const action =
document.getElementById("action").value;

const reward =
parseInt(
document.getElementById("reward").value
);

const budget =
parseInt(
document.getElementById("budget").value
);

if(!linkId){

showMessage("Select a link first.");
return;

}

if(!reward || reward < 1){

showMessage("Enter reward points.");
return;

}

if(!budget || budget < reward){

showMessage(
"Budget must be equal to or greater than reward."
);

return;

}

const availablePoints =
parseInt(
document.getElementById("points").innerText
);

if(budget > availablePoints){

showMessage(
"Not enough points for this campaign."
);

return;

}

showMessage("Creating campaign...");

const {error} =
await supabaseClient
.from("campaigns")
.insert({

user_id:currentProfile.id,
link_id:parseInt(linkId),
action:action,
reward_points:reward,
budget_points:budget,
title:action+" Campaign",
active:true

});

if(error){

showMessage(error.message);
return;

}

showMessage(
"Campaign created successfully! ✅"
);

await loadCampaigns();

}


/* LOAD MY CAMPAIGNS */

async function loadCampaigns(){

const {data,error} =
await supabaseClient
.from("campaigns")
.select("*")
.eq("user_id",currentProfile.id)
.order("created_at",{ascending:false});

const box =
document.getElementById("myCampaigns");

if(error){

box.innerHTML =
"<p>Could not load campaigns.</p>";

return;

}

if(!data || data.length===0){

box.innerHTML =
"<p>No campaigns yet.</p>";

return;

}

box.innerHTML="";

data.forEach(campaign=>{

const div =
document.createElement("div");

div.className="campaign";

div.innerHTML =
"<b>"+campaign.title+"</b><br>" +
"🎯 Action: "+campaign.action+"<br>" +
"⭐ Reward: "+campaign.reward_points+
" Points<br>" +
"💰 Budget: "+campaign.budget_points+
" Points<br>" +
"Status: "+
(campaign.active ? "🟢 Active" : "🔴 Closed");

box.appendChild(div);

});

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;
currentProfile=null;

document.getElementById("dashboard")
.classList.add("hidden");

document.getElementById("loginBox")
.classList.remove("hidden");

}


/* MESSAGE */

function showMessage(text){

document.getElementById("message")
.innerText=text;

}


/* CHECK LOGIN */

async function checkUser(){

const {data} =
await supabaseClient.auth.getUser();

if(data.user){

currentUser=data.user;

await loadProfile();

if(currentProfile){

await showDashboard();

}

}

}

checkUser();

</script>

</body>
</html>
